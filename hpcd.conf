// Edge configuration of the demo fleet (Brocoli).
%include "secrets.conf";
%include "other.conf";

config.prometheus_port = 11450;
config.cache.ram.max_memory = 8_Gio;

auto& vh = config.vhosts["live"] = {
    .pattern = "live\\.example\\.com",
    .endpoints = {endpoint(HTTP, 80), endpoint(HTTPS, 443)},
    .certificates = {selfsigned_certificate("live")}};

vh << route(GET, "/health", [](client_request& req, client_reply& rsp) -> future<> {
    co_await rsp.set_error(req, 200);
});
